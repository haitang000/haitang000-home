<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <script>
        (function () {
            try {
                var ua = window.navigator.userAgent;
                var isOutdated = ua.indexOf('MSIE ') > -1 || ua.indexOf('Trident/') > -1 || ua.indexOf('PaleMoon') > -1;
                if (isOutdated) throw 1;
                new Function('let a=1;const b=2;const c=()=>{};class D{}');
                if (!window.customElements || !window.fetch || !window.Promise) throw 1;
            } catch (e) {
                window.location.href = '/browser-outdated.html';
            }
        })();
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Not Found</title>
    <link rel="stylesheet" href="index.css">
    <link rel="icon" href="/assets/avatar/avatar.jpg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://kit.fontawesome.com/aa17b4b6b9.js" crossorigin="anonymous"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #f4f4f5;
            font-family: 'Google Sans', sans-serif;
            color: #1d1d1f;
        }

        .error-container {
            text-align: center;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .error-icon {
            width: 120px;
            height: 120px;
            margin-bottom: 2rem;
            filter: grayscale(1);
            opacity: 0;
            animation: smoothFadeIn 0.7s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }

        h1 {
            font-size: 3rem;
            margin: 0;
            font-weight: 700;
            letter-spacing: -1px;
            opacity: 0;
            animation: smoothFadeIn 0.7s cubic-bezier(0.22, 1, 0.36, 1) forwards 0.1s;
        }

        p {
            color: #86868b;
            font-size: 1.1rem;
            margin: 1rem 0 2rem;
            opacity: 0;
            animation: smoothFadeIn 0.7s cubic-bezier(0.22, 1, 0.36, 1) forwards 0.2s;
        }

        @keyframes smoothFadeIn {
            0% {
                opacity: 0;
                transform: translateY(20px) scale(0.98);
            }

            100% {
                opacity: 0.8;
                transform: translateY(0) scale(1);
            }
        }

        @keyframes gentleFloat {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-15px);
            }
        }
    </style>
</head>

<body>

    <div class="error-container">
        <img src="/assets/icon/unknown.png" alt="404 Icon" class="error-icon">
        <h1>404 Not Found</h1>
        <p>啥都木有:(</p>
    </div>
</body>

</html>
